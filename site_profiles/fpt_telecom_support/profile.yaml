id: fpt_telecom_support
name: FPT Telecom - Hi FPT Usage Guides
topic: Vietnamese Customer Support
domain_label: customer_support
enabled: true

# The old /ho-tro/cau-hoi-thuong-gap endpoint currently responds HTTP 500.
# Public Hi FPT help center contains customer-support Q&A and step-by-step guides.
seed_urls:
  - https://fpt.vn/hi-fpt/huong-dan-su-dung

allowed_domains:
  - fpt.vn
  - www.fpt.vn

user_agent: "VIRERetrievalCrawler/1.0 (academic research; respectful crawling)"

crawl:
  max_depth: 2
  max_pages: 500
  max_requests: 1200
  request_timeout: 20

rate_limit:
  initial_delay: 2.0
  min_delay: 2.0
  max_delay: 120.0
  max_retries: 5
  retry_statuses: [429, 503]
  success_window: 8
  recovery_factor: 0.85

policy:
  robots: respect
  robots_unavailable: block
  stop_host_statuses: [401, 403]
  challenge_patterns:
    - "just a moment"
    - "access denied"
    - "verify you are human"
    - "captcha"
    - "cf-chl-"

url:
  trailing_slash: remove
  allow_path_regex:
    - '^/hi-fpt/huong-dan-su-dung/?$'
    - '^/hi-fpt/huong-dan-su-dung/[^/]+/?$'
    - '^/hi-fpt/huong-dan-su-dung/[^/]+/[^/]+/?$'
  strip_query_prefixes: [utm_]
  strip_query_keys: [ref]
  sort_query: true

page_types:
  - name: help_listing
    url_regex: '^/hi-fpt/huong-dan-su-dung/?$'
  - name: help_category
    url_regex: '^/hi-fpt/huong-dan-su-dung/[^/]+/?$'
  - name: help_detail
    url_regex: '^/hi-fpt/huong-dan-su-dung/[^/]+/[^/]+/?$'

extract:
  parser: html.parser
  strategy: fpt_hifpt
  title:
    selectors: ['main h1', 'article h1', 'h1', 'title']
  content:
    container_selectors: ['main', 'article', 'body']
    remove_selectors: ['script', 'style', 'noscript', 'nav', 'footer', 'header', 'form']
  metadata: []

links:
  default_follow: false
  rules:
    # The root points to topic pages and also directly to article pages.
    # Topic pages point to articles. Detail pages are not traversed further.
    - source_path_regex: '^/hi-fpt/huong-dan-su-dung(?:/[^/]+)?/?$'
      selector: 'a[href]'
      target_path_regex: '^/hi-fpt/huong-dan-su-dung/[^/]+(?:/[^/]+)?/?$'

# Short customer-support answers are useful retrieval documents.
preprocess:
  min_words: 9
  min_chars: 45
  min_vietnamese_score: 0.25
  min_relevance_score: 0.125
  min_keyword_hits: 1
  relevance_keywords:
    - fpt
    - internet
    - wifi
    - wi-fi
    - mạng
    - thiết bị
    - camera
    - truyền hình
    - dịch vụ
    - tài khoản
    - thanh toán
    - cước
    - khách hàng
    - hỗ trợ
    - đăng nhập
    - ứng dụng
    - mật khẩu
    - lắp đặt
    - hợp đồng
    - fgold
    - bảo hành
    - hi fpt
    - modem
    - bộ phát
    - hóa đơn
    - sự cố
    - kết nối
  chunk_words: 180
  chunk_overlap_words: 35
  min_chunk_words: 9
